[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
include = [
	"ballet",
	"ballet-planner-mus*",
	"balletplus",
	"examples",
	"gossip",
	"README.md"
]

[project]
name = "ballet"
version = "v0.1"
dependencies = [
	"flask == 2.3.3",
	"grpcio == 1.70.0",
	"protobuf == 4.24.3",
	"PyYAML == 6.0.2",
	"eclipse-zenoh == 0.6.0b1",
	"Jinja2 == 3.1.2",
	"requests == 2.31.0",
	"importlib-metadata == 6.1.0",
	"minizinc",
	"concerto @ git+https://github.com/Concerto-D/concerto-decentralized"
]
